<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>¿Cuál rankea mejor? — IMDb Mini Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <main class="game">
      <header class="game-header">
        <h1>¿Cuál rankea mejor?</h1>
        <div class="score">
          <span>Aciertos: <b id="score-hits">0</b></span>
          <span>Rondas: <b id="score-total">0</b></span>
          <button id="btn-next" class="secondary" hidden>Siguiente</button>
        </div>
      </header>

      <section id="round" class="round">
        <p class="loading">Cargando películas…</p>
      </section>

      <p class="hint">Tocá la versión que creas que tiene mejor rating de IMDb.</p>
    </main>

    <aside class="chat">
      <div class="chat-header">
        <h2>Chat</h2>
        <input id="chat-name" type="text" placeholder="Tu nombre" maxlength="20" />
      </div>
      <div id="chat-messages" class="chat-messages">
        <p class="chat-status" id="chat-status">Conectando…</p>
      </div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="Escribí un mensaje…" maxlength="300" autocomplete="off" />
        <button type="submit">Enviar</button>
      </form>
    </aside>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
